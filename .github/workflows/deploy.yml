name: CI/CD Deployment Pipeline (Railway & Vercel)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Quality Verification
  # -------------------------------------------------------------
  verify-build:
    name: Verify Builds & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies & Validate
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Install Frontend Dependencies & Validate
        run: |
          cd frontend
          npm ci
          npm run build

  # -------------------------------------------------------------
  # Job 2: Deploy Backend to Railway
  # -------------------------------------------------------------
  deploy-backend-railway:
    name: Deploy Backend to Railway
    needs: verify-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI & Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN is not set in GitHub Repository Secrets. Skipping Railway deployment step."
            exit 0
          fi
          npm i -g @railway/cli
          railway up --service backend --detach

  # -------------------------------------------------------------
  # Job 3: Deploy Frontend to Vercel
  # -------------------------------------------------------------
  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel
    needs: verify-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Action
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
